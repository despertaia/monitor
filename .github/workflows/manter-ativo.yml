# O GitHub desliga o agendamento de um repositório público depois de 60 dias sem atividade.
# Uma vez por mês este workflow grava a data num arquivo, e o alarme continua ligado.
name: Manter ativo

on:
  schedule:
    - cron: '17 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > ultima-atividade.txt
          git config user.name "Desperta.IA"
          git config user.email "daniel@despertaia.com.br"
          git add ultima-atividade.txt
          git commit -m "manter o alarme ativo" && git push
